[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-the-plan"
version = "0.1.0"
description = "Local, evidence-backed queries over IFC building models"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "ifcopenshell>=0.8.3,<1",
    "openai>=2.54,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5", "pytest>=8,<10", "Pillow>=12,<13", "numpy>=1.24,<3"]
experiments = ["Pillow>=12,<13"]
api = ["fastapi>=0.115.12,<1", "starlette>=0.46,<2", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "Pillow>=12,<13", "numpy>=1.24,<3", "ezdxf>=1.4.3,<2"]
preprocess = ["Pillow>=12,<13", "numpy>=1.24,<3", "shapely>=2,<3"]
vision = ["opencv-python-headless>=4.13,<5"]

[project.scripts]
ifc-query = "ifc_engine.cli:main"
nemotron = "nemotron.cli:main"
drawing-preprocess = "drawing_preprocessor.cli:main"

[tool.setuptools.packages.find]
include = ["contracts*", "ifc_engine*", "ifc_api*", "dxf_api*", "nemotron*", "gemini*", "image_api*", "drawing_preprocessor*", "answer_api*", "document_engine*"]

[tool.setuptools.package-data]
image_api = ["prompt.txt", "gemini_prompt.txt", "decision_questions.json", "region_proposal_prompt.txt", "detail_prompt.txt", "candidate_verification_prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
